name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: invest_agent
          POSTGRES_USER: invest
          POSTGRES_PASSWORD: invest_local
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U invest"
          --health-interval 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Ruff
        working-directory: backend
        run: ruff check .
      - name: Pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://invest:invest_local@localhost:5432/invest_agent
          REDIS_URL: redis://localhost:6379/0
        run: pytest tests/ -v --tb=short

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install and test
        working-directory: frontend
        run: |
          npm install
          npm run test
          npm run build
