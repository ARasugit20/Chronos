name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - working-directory: backend
        run: ruff check .

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e "./backend[dev]"
      - working-directory: backend
        run: mypy app --ignore-missing-imports

  test:
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: invest_agent
          POSTGRES_USER: invest
          POSTGRES_PASSWORD: invest_local
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U invest"
          --health-interval 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e "./backend[dev]"
      - run: chmod +x scripts/run_ci_tests.sh scripts/run_backend_tests.py scripts/validate_migrations.py
      - run: python scripts/validate_migrations.py
      - env:
          DATABASE_URL: postgresql+asyncpg://invest:invest_local@localhost:5432/invest_agent
        working-directory: backend
        run: alembic upgrade head
      - env:
          DATABASE_URL: postgresql+asyncpg://invest:invest_local@localhost:5432/invest_agent
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
          PAPER_AUTO_APPROVE: "false"
        run: bash scripts/run_ci_tests.sh tests/ -v --tb=short

  coverage:
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: invest_agent
          POSTGRES_USER: invest
          POSTGRES_PASSWORD: invest_local
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e "./backend[dev]" pytest-cov
      - run: chmod +x scripts/run_ci_tests.sh scripts/run_backend_tests.py
      - env:
          DATABASE_URL: postgresql+asyncpg://invest:invest_local@localhost:5432/invest_agent
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
        run: bash scripts/run_ci_tests.sh tests/ --cov=app --cov-report=term --cov-fail-under=60 -q

  e2e:
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: invest_agent
          POSTGRES_USER: invest
          POSTGRES_PASSWORD: invest_local
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e "./backend[dev]"
      - run: chmod +x scripts/run_ci_tests.sh scripts/run_backend_tests.py
      - env:
          DATABASE_URL: postgresql+asyncpg://invest:invest_local@localhost:5432/invest_agent
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
        run: bash scripts/run_ci_tests.sh tests/test_e2e_smoke.py -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run test
          npx tsc --noEmit
          npm run build
