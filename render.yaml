# Render.com blueprint for Chronos production deployment
services:
  - type: web
    name: chronos-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chronos-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: chronos-redis
          type: redis
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: NEWS_SOURCE
        value: finnhub
      - key: NEWS_API_KEY
        sync: false
      - key: POLYGON_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: PAPER_TRADING_MODE
        value: "true"
      - key: CORS_ORIGINS
        value: '["https://chronos-frontend.onrender.com"]'

  - type: worker
    name: chronos-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: celery -A app.workers.celery_app worker --beat --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chronos-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: chronos-redis
          type: redis
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: NEWS_SOURCE
        value: finnhub
      - key: NEWS_API_KEY
        sync: false
      - key: POLYGON_API_KEY
        sync: false

  - type: redis
    name: chronos-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: chronos-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: chronos-api
          type: web
          property: host

databases:
  - name: chronos-db
    plan: starter
    databaseName: invest_agent
    user: invest
